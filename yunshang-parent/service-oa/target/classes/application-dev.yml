server:
  port: 8801
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yunshang-oa?serverTimezone=Asia/Shanghai&characterEncoding=utf-8&rewriteBatchedStatements=true
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    host: localhost
    port: 6379
    database: 0
    connect-timeout: 180000
    jedis:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 8
        min-idle: 0
  activiti:
    database-schema-update: true
    db-history-used: true
    history-level: full
    check-process-definitions: true
    async-executor-activate: true
  main:
    allow-circular-references: true
# 流程文件存储配置
process:
  # 流程定义文件存储基础路径（数据库存的是相对路径如 processes/xxx.zip）
  storage-path: /Users/louiszhen/Desktop/temp

